<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronómetro · 프리다 칼로</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --rojo: #b3261a;      /* terracotta red */
    --verde: #1f6b4f;     /* deep green */
    --oro: #e0a526;       /* marigold gold */
    --azul: #1d5a8a;      /* cobalt blue */
    --magenta: #c0356b;   /* bougainvillea */
    --crema: #f5e9cf;     /* cream */
    --tinta: #2a1810;     /* dark brown ink */
  }
  body {
    font-family: "Cormorant Garamond", serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(224,165,38,.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(192,53,107,.18), transparent 45%),
      #3a1f14;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .frame {
    position: relative;
    width: 100%;
    max-width: 440px;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,.02) 0 12px, rgba(0,0,0,0) 12px 24px),
      var(--crema);
    border: 10px solid var(--verde);
    border-radius: 18px;
    box-shadow:
      0 0 0 4px var(--oro),
      0 0 0 14px var(--rojo),
      0 22px 50px rgba(0,0,0,.55);
    padding: 44px 32px 36px;
    text-align: center;
    color: var(--tinta);
    overflow: hidden;
  }
  /* floral corners */
  .flower {
    position: absolute;
    font-size: 30px;
    opacity: .9;
    user-select: none;
    pointer-events: none;
  }
  .f1 { top: 6px; left: 10px; transform: rotate(-15deg); }
  .f2 { top: 6px; right: 10px; transform: rotate(20deg); }
  .f3 { bottom: 6px; left: 10px; transform: rotate(15deg); }
  .f4 { bottom: 6px; right: 10px; transform: rotate(-20deg); }

  .title {
    font-family: "Playfair Display", serif;
    font-style: italic;
    font-size: 26px;
    color: var(--rojo);
    letter-spacing: .5px;
    margin-bottom: 2px;
  }
  .subtitle {
    font-size: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--verde);
    margin-bottom: 22px;
  }
  .leaf-divider {
    color: var(--verde);
    font-size: 18px;
    letter-spacing: 6px;
    margin-bottom: 18px;
  }

  .display {
    font-family: "Playfair Display", serif;
    font-size: 70px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--tinta);
    line-height: 1;
    text-shadow: 2px 2px 0 rgba(224,165,38,.55);
  }
  .display .ms {
    font-size: 30px;
    color: var(--magenta);
  }

  .buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 30px 0 22px;
  }
  button {
    flex: 1;
    padding: 15px 0;
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 3px solid var(--tinta);
    border-radius: 12px;
    cursor: pointer;
    color: var(--crema);
    box-shadow: 3px 3px 0 var(--tinta);
    transition: transform .06s, box-shadow .06s, background .2s;
  }
  button:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--tinta);
  }
  button:disabled { opacity: .4; cursor: default; box-shadow: 3px 3px 0 var(--tinta); }
  .start { background: var(--verde); }
  .stop  { background: var(--rojo); }
  .lap   { background: var(--azul); }
  .reset { background: var(--magenta); }

  .laps {
    list-style: none;
    margin-top: 6px;
    max-height: 220px;
    overflow-y: auto;
    text-align: left;
  }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 11px 6px;
    border-bottom: 1px dashed var(--verde);
    font-size: 19px;
    font-variant-numeric: tabular-nums;
  }
  .laps li span:first-child {
    color: var(--rojo);
    font-style: italic;
    font-family: "Playfair Display", serif;
  }
  .laps li span:last-child { color: var(--tinta); }
  .laps::-webkit-scrollbar { width: 6px; }
  .laps::-webkit-scrollbar-thumb { background: var(--oro); border-radius: 3px; }
</style>
</head>
<body>
  <div class="frame">
    <span class="flower f1">🌺</span>
    <span class="flower f2">🌼</span>
    <span class="flower f3">🌷</span>
    <span class="flower f4">🌻</span>

    <div class="title">Cronómetro</div>
    <div class="subtitle">El Tiempo</div>
    <div class="leaf-divider">🌿 ❦ 🌿</div>

    <div class="display"><span id="time">00:00</span><span class="ms" id="ms">.00</span></div>

    <div class="buttons">
      <button class="lap" id="lapBtn" disabled>Vuelta</button>
      <button class="start" id="startBtn">Iniciar</button>
    </div>

    <ul class="laps" id="laps"></ul>
  </div>

<script>
  let startTime = 0;
  let elapsed = 0;
  let timerId = null;
  let running = false;
  let lapCount = 0;
  let lastLap = 0;

  const timeEl = document.getElementById('time');
  const msEl = document.getElementById('ms');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapsEl = document.getElementById('laps');

  function format(t) {
    const totalMs = Math.floor(t);
    const m = Math.floor(totalMs / 60000);
    const s = Math.floor((totalMs % 60000) / 1000);
    const cs = Math.floor((totalMs % 1000) / 10);
    return {
      main: `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`,
      ms: `.${String(cs).padStart(2,'0')}`
    };
  }

  function render() {
    const now = performance.now();
    const total = elapsed + (running ? now - startTime : 0);
    const f = format(total);
    timeEl.textContent = f.main;
    msEl.textContent = f.ms;
  }

  function start() {
    running = true;
    startTime = performance.now();
    timerId = setInterval(render, 16);
    startBtn.textContent = 'Parar';
    startBtn.classList.replace('start', 'stop');
    lapBtn.textContent = 'Vuelta';
    lapBtn.disabled = false;
  }

  function stop() {
    running = false;
    elapsed += performance.now() - startTime;
    clearInterval(timerId);
    startBtn.textContent = 'Seguir';
    startBtn.classList.replace('stop', 'start');
    lapBtn.textContent = 'Reiniciar';
    lapBtn.classList.replace('lap', 'reset');
  }

  function reset() {
    elapsed = 0;
    lapCount = 0;
    lastLap = 0;
    lapsEl.innerHTML = '';
    render();
    startBtn.textContent = 'Iniciar';
    lapBtn.textContent = 'Vuelta';
    lapBtn.classList.replace('reset', 'lap');
    lapBtn.disabled = true;
  }

  function addLap() {
    const total = elapsed + (running ? performance.now() - startTime : 0);
    lapCount++;
    const lapTime = total - lastLap;
    lastLap = total;
    const f = format(lapTime);
    const li = document.createElement('li');
    li.innerHTML = `<span>Vuelta ${lapCount}</span><span>${f.main}${f.ms}</span>`;
    lapsEl.prepend(li);
  }

  startBtn.addEventListener('click', () => running ? stop() : start());
  lapBtn.addEventListener('click', () => running ? addLap() : reset());

  render();
</script>
</body>
</html>
