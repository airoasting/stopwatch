<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%;
    max-width: 360px;
    padding: 40px 28px;
    text-align: center;
  }
  .time {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: 64px;
    font-weight: 200;
    letter-spacing: 1px;
    margin-bottom: 36px;
  }
  .time .cs { font-size: 32px; color: #8a8f98; }
  .controls { display: flex; gap: 12px; justify-content: center; }
  button {
    flex: 1;
    padding: 16px 0;
    font-size: 16px;
    font-weight: 500;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #f5f5f7;
    background: #2a2d35;
    transition: transform .08s ease, background .15s ease, opacity .15s ease;
  }
  button:hover { background: #353942; }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid #6ea8fe; outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #startBtn { background: #2e7d4f; }
  #startBtn:hover { background: #36925c; }
  #startBtn.running { background: #b03636; }
  #startBtn.running:hover { background: #c44040; }
  .laps {
    list-style: none;
    margin-top: 28px;
    max-height: 220px;
    overflow-y: auto;
    text-align: left;
  }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 12px 4px;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    border-bottom: 1px solid #22252c;
    color: #c7ccd4;
  }
  .laps li .idx { color: #8a8f98; }
</style>
</head>
<body>
  <main class="card">
    <div class="time" id="display" aria-live="off">00:00<span class="cs">.00</span></div>
    <div class="controls">
      <button id="lapBtn" disabled>랩</button>
      <button id="startBtn">시작</button>
    </div>
    <ul class="laps" id="laps"></ul>
  </main>

<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapsEl = document.getElementById('laps');

  let running = false;
  let startTime = 0;      // 현재 구간 시작 시각
  let elapsed = 0;        // 누적 경과(ms)
  let rafId = null;
  let lapCount = 0;
  let lastLapTime = 0;

  function now() { return performance.now(); }

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const s = totalSec % 60;
    const totalMin = Math.floor(totalSec / 60);
    const m = totalMin % 60;
    const h = Math.floor(totalMin / 60);
    const p = (n) => String(n).padStart(2, '0');
    const main = h > 0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
    return { main, cs: p(cs) };
  }

  function render() {
    const total = elapsed + (running ? now() - startTime : 0);
    const { main, cs } = format(total);
    display.innerHTML = `${main}<span class="cs">.${cs}</span>`;
  }

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    running = true;
    startTime = now();
    rafId = requestAnimationFrame(tick);
    startBtn.textContent = '정지';
    startBtn.classList.add('running');
    lapBtn.textContent = '랩';
    lapBtn.disabled = false;
  }

  function stop() {
    running = false;
    elapsed += now() - startTime;
    cancelAnimationFrame(rafId);
    render();
    startBtn.textContent = '재개';
    startBtn.classList.remove('running');
    lapBtn.textContent = '리셋';
  }

  function reset() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0;
    startTime = 0;
    lapCount = 0;
    lastLapTime = 0;
    lapsEl.innerHTML = '';
    render();
    startBtn.textContent = '시작';
    lapBtn.textContent = '랩';
    lapBtn.disabled = true;
  }

  function lap() {
    const total = elapsed + (running ? now() - startTime : 0);
    const split = total - lastLapTime;
    lastLapTime = total;
    lapCount++;
    const t = format(split);
    const li = document.createElement('li');
    li.innerHTML = `<span class="idx">랩 ${lapCount}</span><span>${t.main}.${t.cs}</span>`;
    lapsEl.prepend(li);
  }

  startBtn.addEventListener('click', () => running ? stop() : start());
  lapBtn.addEventListener('click', () => running ? lap() : reset());

  // 스페이스: 시작/정지, L: 랩/리셋
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); running ? stop() : start(); }
    else if (e.key.toLowerCase() === 'l' && !lapBtn.disabled) { running ? lap() : reset(); }
  });

  render();
</script>
</body>
</html>
